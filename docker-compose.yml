services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: career_path_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career_path_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
